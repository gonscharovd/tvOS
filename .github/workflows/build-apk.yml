name: Build custom tvOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ram-cleaner-happ-vpn

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build and sign development APK
        run: bash build.sh

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/tvos-home.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/tvos-home.apk | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvos-custom-2.1.2-custom1
          path: build/tvos-home.apk
          if-no-files-found: error
          retention-days: 14
