name: Release testOS APK

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSET_OPTIMIZE: "1"
      ASSET_PROFILE: "sber"
    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Install Pillow for asset optimization
        run: python3 -m pip install --disable-pip-version-check Pillow fonttools

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Prepare persistent release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$RELEASE_KEYSTORE_PASS" || { echo "Missing RELEASE_KEYSTORE_PASS secret" >&2; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret" >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvos-release.jks"
          test -s "$RUNNER_TEMP/tvos-release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/tvos-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASS=$RELEASE_KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Derive release version from branch
        run: |
          set -euo pipefail
          source ./version.properties
          VERSION_NAME="${GITHUB_REF_NAME#release/}"
          case "$VERSION_NAME" in
            "$RELEASE_VERSION_PREFIX"*) ;;
            *) echo "Expected branch release/${RELEASE_VERSION_PREFIX}PATCH, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          PATCH="${VERSION_NAME#"$RELEASE_VERSION_PREFIX"}"
          if [[ ! "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Invalid release PATCH in version: $VERSION_NAME" >&2
            exit 1
          fi
          VERSION_CODE=$((RELEASE_VERSION_CODE_BASE + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building testOS $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Test CleanMyTV package protection
        run: python3 tests/test_clean_your_tv_protection.py
      - name: Test artwork memory and Settings cleanup
        run: python3 tests/test_memory_settings_cleanup.py
      - name: Test settings backup safety
        run: python3 tests/test_settings_backup_safety.py
      - name: Test bitmap decode memory policy
        run: python3 tests/test_bitmap_decode_config.py
      - name: Test build-time asset optimization
        run: python3 tests/test_asset_optimizer.py
      - name: Test Sber font subset
        run: python3 tests/test_sber_font_subsetting.py

      - name: Test grouped Settings navigation
        run: python3 tests/test_settings_navigation.py

      - name: Test OTA version comparison
        run: |
          mkdir -p /tmp/tvos-version-tests
          javac --release 11 -d /tmp/tvos-version-tests src/com/techgenius/tvoslauncher/VersionComparator.java tests/VersionComparatorTest.java
          java -cp /tmp/tvos-version-tests com.techgenius.tvoslauncher.VersionComparatorTest

      - name: Test cross-platform build contract
        run: python3 tests/test_build_contract.py

      - name: Test OTA install flow
        run: python3 tests/test_ota_install_flow.py

      - name: Test Control Panel, Russian localization and clock fonts
        run: python3 tests/test_control_panel_russian_clock.py

      - name: Test full Russian localization coverage
        run: python3 tests/test_russian_localization_coverage.py

      - name: Test dynamic Russian translations
        run: |
          mkdir -p /tmp/tvos-i18n-tests
          javac --release 11 -cp "$ANDROID_HOME/platforms/android-34/android.jar" -d /tmp/tvos-i18n-tests src/com/techgenius/tvoslauncher/I18n.java tests/i18n_stubs/com/techgenius/tvoslauncher/Scenes.java tests/I18nDynamicTranslationTest.java
          java -cp "/tmp/tvos-i18n-tests:$ANDROID_HOME/platforms/android-34/android.jar" com.techgenius.tvoslauncher.I18nDynamicTranslationTest

      - name: Build release APK
        run: bash build.sh

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/tvos-home.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/tvos-home.apk | grep -qi '5dbf8846d9bb76a764928da8c8a833a837b44ba00f4a7c0b60dc77490319b10a'
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/tvos-home.apk | tee /tmp/tvos-badging.txt
          grep -F "package: name='com.gonscharovd.tvoslauncher' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" /tmp/tvos-badging.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: testOS ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: build/tvos-home.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tvos-release.jks"
